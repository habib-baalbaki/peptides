<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared/style.css">
<style>.side { font-size: 24px; font-weight: 400; letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="chapter"><b>05</b>Receptor signalling</div>
<div class="label side" id="out">Outside the cell</div>
<div class="label side" id="in">Inside the cell</div>
<div class="label amber" id="bilayer">Lipid bilayer</div>
<div class="label violet" id="gpcr">GPCR<small>G-protein coupled receptor</small></div>
<div class="label cyan" id="pep">Peptide</div>
<div class="label violet" id="conf">Receptor changes shape</div>
<div class="label amber" id="gp">G-protein<small>activated on the inner side</small></div>
<div class="label amber" id="camp">cAMP</div>
<div class="label green" id="ca">Ca²⁺</div>
<div class="label" id="nuc">Signal reaches the nucleus<small>genes · ion channels · metabolism</small></div>
<div id="fade"></div>
<script type="module">
import { W, H, C, canvas, duration, background, sphere, bond, rng, seg, ease, easeOut, lerp, rgba, shade, place, inOut, frameFade, fontsReady, clamp, warp } from "./shared/lib.js";

const D = duration(44.5);
const T = warp([[0, 0], [3, 4.6], [5, 8.9], [8.5, 13.2], [9.5, 13.8], [14, 16.2], [22.5, 27.2], [26, 31], [29, 33.6], [33, 37.1], [44, 44.5]]);
const ctx = canvas();
const $ = (id) => document.getElementById(id);

const TOP = 450, BOT = 610, MID = (TOP + BOT) / 2;
const RX0 = 800, RX1 = 1120;
const CH = 1520; // ion channel

function membrane(t, open) {
  // tails then heads
  ctx.lineCap = "round";
  for (let x = 14; x < W; x += 24) {
    if (x > RX0 - 20 && x < RX1 + 20) continue;
    if (Math.abs(x - CH) < 50 + open * 30) continue;
    const w = Math.sin(x / 70 + t * 1.2) * 4;
    ctx.strokeStyle = rgba(C.amber, 0.28);
    ctx.lineWidth = 3;
    for (const dx of [-4, 4]) {
      ctx.beginPath(); ctx.moveTo(x + dx, TOP + 12); ctx.quadraticCurveTo(x + dx + w, TOP + 40, x + dx, MID - 4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + dx, BOT - 12); ctx.quadraticCurveTo(x + dx - w, BOT - 40, x + dx, MID + 4); ctx.stroke();
    }
    sphere(ctx, x, TOP + Math.sin(x / 120 + t) * 3, 11, C.amber, 0.85, 0.15);
    sphere(ctx, x, BOT + Math.sin(x / 120 + t + 1) * 3, 11, C.amber, 0.85, 0.15);
  }
}

function capsule(x1, y1, x2, y2, r, col, light) {
  const dx = x2 - x1, dy = y2 - y1, n = Math.hypot(dx, dy), nx = -dy / n, ny = dx / n;
  const g = ctx.createLinearGradient(x1 + nx * r, y1 + ny * r, x1 - nx * r, y1 - ny * r);
  g.addColorStop(0, shade(col, -0.6 + light)); g.addColorStop(0.45, shade(col, 0.2 + light)); g.addColorStop(1, shade(col, -0.7 + light));
  ctx.strokeStyle = g; ctx.lineWidth = r * 2; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function gpcr(t, conf, glow) {
  const helices = [];
  for (let i = 0; i < 7; i++) {
    const cx = RX0 + 30 + i * 43;
    const spreadTop = (i - 3) * -6 * conf, spreadBot = (i - 3) * 12 * conf + (i === 5 ? 34 * conf : 0);
    helices.push({ x1: cx + spreadTop, y1: TOP - 50, x2: cx + spreadBot, y2: BOT + 45, back: i % 2 === 1 });
  }
  // loops
  ctx.strokeStyle = shade(C.violet, -0.2, 0.9); ctx.lineWidth = 9;
  for (let i = 0; i < 6; i++) {
    const a = helices[i], b = helices[i + 1], top = i % 2 === 1;
    ctx.beginPath();
    if (top) { ctx.moveTo(a.x1, a.y1); ctx.bezierCurveTo(a.x1, a.y1 - 70, b.x1, b.y1 - 70, b.x1, b.y1); }
    else { ctx.moveTo(a.x2, a.y2); ctx.bezierCurveTo(a.x2, a.y2 + 70, b.x2, b.y2 + 70, b.x2, b.y2); }
    ctx.stroke();
  }
  for (const back of [true, false]) for (const h of helices) if (h.back === back) capsule(h.x1, h.y1, h.x2, h.y2, 21, C.violet, (back ? -0.15 : 0.05) + glow * 0.3);
  return helices;
}

const R = rng(51);
const CAMP = Array.from({ length: 140 }, (_, i) => ({ birth: i * 0.09, ang: Math.PI * (0.15 + R() * 0.7), sp: 70 + R() * 120, wob: R() * 6 }));
const IONS = Array.from({ length: 70 }, (_, i) => ({ birth: i * 0.14, dx: (R() - 0.5) * 30, sp: 160 + R() * 80, spread: (R() - 0.5) * 220 }));

window.film = {
  duration: D,
  ready: fontsReady(),
  frame(t) {
    background(ctx, t, 17, C.violet, [0.5, 0.3]);
    // inside the cell: a warmer tint
    const ig = ctx.createLinearGradient(0, BOT, 0, H);
    ig.addColorStop(0, "rgba(255,179,71,.05)"); ig.addColorStop(1, "rgba(255,179,71,.0)");
    ctx.fillStyle = ig; ctx.fillRect(0, BOT, W, H - BOT);

    const dockT = T(14);
    const conf = ease(seg(t, dockT, dockT + T(1.6)));
    const flash = Math.max(0, 1 - Math.abs(t - dockT - 0.2) / 0.9);
    const open = ease(seg(t, T(29), T(30.5)));

    // nucleus
    const nuc = seg(t, T(33), T(35));
    const ng = ctx.createRadialGradient(W / 2, 1640, 520, W / 2, 1640, 700);
    ng.addColorStop(0, rgba(C.blue, 0.25 + 0.25 * nuc)); ng.addColorStop(1, rgba(C.blue, 0));
    ctx.fillStyle = ng; ctx.beginPath(); ctx.arc(W / 2, 1640, 700, 0, 7); ctx.fill();
    ctx.strokeStyle = rgba(C.blue, 0.5 + 0.4 * nuc); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(W / 2, 1640, 600, 0, 7); ctx.stroke();

    membrane(t, open);
    // ion channel
    for (const s of [-1, 1]) capsule(CH + s * (26 + open * 26), TOP - 30, CH + s * (26 + open * 26), BOT + 30, 22, C.green, -0.1);

    gpcr(t, conf, flash);

    // G-protein: γ, β stay; α leaves once activated
    const aGo = ease(seg(t, T(22.5), T(25.5)));
    const ax = lerp(1035, 1250, aGo), ay = lerp(BOT + 95, BOT + 200, aGo);
    sphere(ctx, 870, BOT + 75, 28, C.green, 1, 0.3);
    sphere(ctx, 935, BOT + 95, 42, C.blue, 1, 0.3);
    sphere(ctx, ax, ay, 48, C.amber, 1, 0.4 + 1.2 * Math.max(0, 1 - Math.abs(t - T(24)) / T(2)));

    // golden ripples from the α subunit toward the nucleus
    if (t > T(26)) {
      for (let n = 0; n < 12; n++) {
        const age = t - T(26) - n * T(1.4);
        if (age < 0 || age > 3.2) continue;
        ctx.strokeStyle = rgba(C.amber, 0.45 * (1 - age / 3.2)); ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(ax, ay, 60 + age * 160, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      }
    }
    // cAMP
    for (const p of CAMP) {
      const age = t - T(26) - p.birth;
      if (age < 0 || age > 5) continue;
      const x = ax + Math.cos(p.ang) * p.sp * age + Math.sin(age * 2 + p.wob) * 12, y = ay + Math.sin(p.ang) * p.sp * age * 0.9;
      sphere(ctx, x, y, 7, C.amber, clamp(1.2 - age / 5) * clamp(age * 3), 1.2);
    }
    // calcium through the channel
    for (const p of IONS) {
      const age = t - T(30) - p.birth;
      if (age < 0 || age > 4) continue;
      const y = TOP - 60 + p.sp * age, x = CH + p.dx * (y < BOT ? 0.3 : 1) + (y > BOT ? p.spread * (y - BOT) / 400 : 0);
      sphere(ctx, x, y, 8, C.green, clamp(1.3 - age / 4) * clamp(age * 3), 1.2);
    }

    // the peptide, coming down to the pocket
    const pd = ease(seg(t, T(9.5), dockT));
    const px = 960, py = lerp(110, TOP - 95, pd);
    const pts = [];
    for (let i = 0; i < 8; i++) { const s = i - 3.5; pts.push({ x: px + s * 26 + Math.sin(t * 2 + i) * 4 * (1 - conf), y: py + Math.abs(s) * 9 * (1 - pd) + (pd > 0.99 ? Math.abs(s) * -3 : 0), r: 13, col: i === 0 || i === 7 ? C.amber : C.cyan }); }
    const pa = seg(t, T(8.5), T(9.5));
    for (let i = 1; i < 8; i++) bond(ctx, pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y, 4.5, C.cyan, 0.9 * pa);
    for (const p of pts) sphere(ctx, p.x, p.y, p.r, p.col, pa, 0.8 + flash * 2);
    if (flash > 0) {
      const g = ctx.createRadialGradient(960, TOP - 60, 0, 960, TOP - 60, 400);
      g.addColorStop(0, rgba(C.cyan, 0.45 * flash)); g.addColorStop(1, rgba(C.cyan, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(960, TOP - 60, 400, 0, 7); ctx.fill();
    }

    place($("out"), 260, 330, inOut(t, T(1.5), D));
    place($("in"), 260, 730, inOut(t, T(1.5), D));
    place($("bilayer"), 400, MID, inOut(t, T(3), T(9)));
    place($("gpcr"), RX1 + 170, MID - 10, inOut(t, T(5), T(13)));
    place($("pep"), px + 190, py, inOut(t, T(9.5), T(16)));
    place($("conf"), 960, TOP - 250, inOut(t, T(14.5), T(21)));
    place($("gp"), 760, BOT + 180, inOut(t, T(22), T(29)));
    place($("camp"), ax + 210, ay + 140, inOut(t, T(27), D));
    place($("ca"), CH + 120, BOT + 110, inOut(t, T(30.5), D));
    place($("nuc"), W / 2, 975, inOut(t, T(33.5), D));
    frameFade(t, D);
  },
};
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="shared/style.css">
<style>
  #eq { font-size: 34px; font-weight: 400; letter-spacing: .02em; }
  #eq b { color: var(--coral); font-weight: 600; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="chapter"><b>03</b>The peptide bond</div>
<div class="label cyan" id="amino">Amino group<small>−NH₂</small></div>
<div class="label coral" id="carboxyl">Carboxyl group<small>−COOH</small></div>
<div class="label" id="alpha">α-carbon</div>
<div class="label amber" id="rgroup">R group<small>the side chain</small></div>
<div class="label" id="eq">amino acid + amino acid → dipeptide + <b>H₂O</b></div>
<div class="label cyan" id="water">H₂O<small>released</small></div>
<div class="label cyan" id="pbond">Peptide bond<small>−CO−NH−</small></div>
<div class="label amber" id="planar">Rigid and planar<small>electrons shared by resonance</small></div>
<div class="label cyan big" id="pep">A peptide</div>
<div id="fade"></div>
<script type="module">
import { W, H, C, canvas, duration, background, sphere, bond, rng, seg, ease, easeOut, easeIn, lerp, rgba, place, inOut, frameFade, fontsReady, camera, bump, clamp, warp } from "./shared/lib.js";

const D = duration(49.5);
// beats are written in designed seconds; warp lands them on the narration's words
const T = warp([[0, 0], [5.5, 7.0], [8, 8.7], [10.5, 11.3], [12.5, 13.9], [16, 18.0], [21, 24.4], [24.5, 29.2], [28.5, 36.0], [33, 39.5], [38, 43.4], [41, 46.5], [50, 49.5]]);
const ctx = canvas();
const $ = (id) => document.getElementById(id);

const COL = { C: C.grey, N: C.cyan, O: C.coral, H: C.white, R: C.amber };
const RAD = { C: 34, N: 34, O: 34, H: 20, R: 44 };
// [id, element, x, y, z]; the second amino acid's are given where it ends up
const A = [
  ["N1", "N", -560, 40, 0], ["H1a", "H", -640, -20, 20], ["H1b", "H", -620, 120, -20],
  ["Ca1", "C", -420, -20, 0], ["Ha1", "H", -440, 10, -120], ["R1", "R", -440, -180, 40],
  ["C1", "C", -280, 40, 0], ["O1", "O", -270, 175, 0], ["Oh", "O", -170, -40, 0], ["Hh", "H", -100, -110, 0],
  ["N2", "N", -150, -10, 0], ["H2s", "H", -170, -140, 0], ["H2x", "H", -70, 70, 20],
  ["Ca2", "C", -10, 40, 0], ["Ha2", "H", 0, 10, -120], ["R2", "R", 10, 200, 40],
  ["C2", "C", 130, -20, 0], ["O2", "O", 140, -155, 0], ["Oh2", "O", 250, 45, 0], ["Hh2", "H", 330, 0, 0],
];
const BONDS = [["N1", "H1a"], ["N1", "H1b"], ["N1", "Ca1"], ["Ca1", "Ha1"], ["Ca1", "R1"], ["Ca1", "C1"], ["C1", "O1", 2], ["C1", "Oh"], ["Oh", "Hh"],
  ["N2", "H2s"], ["N2", "H2x"], ["N2", "Ca2"], ["Ca2", "Ha2"], ["Ca2", "R2"], ["Ca2", "C2"], ["C2", "O2", 2], ["C2", "Oh2"], ["Oh2", "Hh2"]];
const SECOND = new Set(["N2", "H2s", "H2x", "Ca2", "Ha2", "R2", "C2", "O2", "Oh2", "Hh2"]);

// more residues, for the end: the backbone zigzag carried on both ways
const EXT = [];
for (let s = 1; s <= 6; s++) {
  for (const side of [-1, 1]) {
    const base = side < 0 ? { x: -560, y: 40 } : { x: 130, y: -20 };
    EXT.push({ el: ["C", "C", "N"][s % 3], x: base.x + side * s * 140, y: (s % 2 ? -1 : 1) * (side < 0 ? 30 : -30) + (side < 0 ? 0 : 20), side, s });
  }
}

const WATER_AT = [-180, -330, 0];

window.film = {
  duration: D,
  ready: fontsReady(),
  frame(t) {
    background(ctx, t, 9, C.cyan);
    const approach = 520 * (1 - ease(seg(t, T(16), T(19.5)))) + 140 * (1 - ease(seg(t, T(26.5), T(28.5))));
    const leave = ease(seg(t, T(21), T(24.5)));        // OH and H rise to meet
    const rise = easeIn(seg(t, T(24.5), T(30)));       // the water drifts off
    const snap = T(28.5);
    const ext = ease(seg(t, T(39), T(43)));
    const pull = ease(seg(t, T(38), T(43)));
    const cam = camera({ yaw: 0.28 * Math.sin(t * 0.18) - 0.05, pitch: 0.12 + 0.06 * Math.sin(t * 0.13), cx: W / 2 + 70 * (1 - pull), cy: H / 2 + 30, dist: 1500, f: 1500, scale: lerp(1.08, 0.66, pull) });

    const pos = {};
    for (const [id, el, x, y, z] of A) {
      let p = [x + 75, y, z];
      if (SECOND.has(id)) p[0] += approach;
      if (id === "Oh" || id === "Hh" || id === "H2x") {
        const w = id === "Oh" ? WATER_AT : id === "Hh" ? [WATER_AT[0] - 60, WATER_AT[1] - 55, 0] : [WATER_AT[0] + 60, WATER_AT[1] - 55, 0];
        const from = p;
        p = [lerp(from[0], w[0] + 75, leave), lerp(from[1], w[1], leave) - rise * 260, lerp(from[2], w[2], leave)];
      }
      if (id === "Oh2" || id === "Hh2") p[0] += ext * 200;
      pos[id] = { ...cam(p), el, id };
    }
    const alphaOf = (id) => (id === "Oh" || id === "Hh" ? 1 - seg(t, T(27), T(31)) : id === "H2x" ? (1 - seg(t, T(27), T(31))) * seg(t, T(15.5), T(17)) : id === "Oh2" || id === "Hh2" ? 1 - ext : SECOND.has(id) ? seg(t, T(15.5), T(17)) : 1);

    // the plane of the peptide bond
    const pl = inOut(t, T(32), T(40), T(1));
    if (pl > 0) {
      const q = ["Ca1", "O1", "N2", "Ca2", "H2s"].map((i) => pos[i]);
      ctx.save();
      ctx.globalAlpha = pl * 0.35;
      ctx.fillStyle = rgba(C.amber, 0.6);
      ctx.beginPath();
      ctx.moveTo(q[0].x, q[0].y); ctx.lineTo(q[4].x - 30, q[4].y - 20); ctx.lineTo(q[3].x + 20, q[3].y - 10); ctx.lineTo(q[2].x + 40, q[2].y + 60); ctx.lineTo(q[1].x, q[1].y + 20);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // bonds, then atoms back to front
    for (const [a, b, order] of BONDS) {
      const pa = pos[a], pb = pos[b];
      let al = Math.min(alphaOf(a), alphaOf(b));
      if ((a === "C1" && b === "Oh") || (a === "N2" && b === "H2x")) al *= 1 - seg(t, T(20.5), T(21.5));
      if (a === "Oh" && b === "Hh") al = Math.max(al, 0);
      const w = 9 * pa.k;
      if (order === 2) {
        const dx = pb.y - pa.y, dy = pa.x - pb.x, n = Math.hypot(dx, dy) || 1, o = 7 * pa.k;
        bond(ctx, pa.x + dx / n * o, pa.y + dy / n * o, pb.x + dx / n * o, pb.y + dy / n * o, w * 0.7, C.white, al);
        bond(ctx, pa.x - dx / n * o, pa.y - dy / n * o, pb.x - dx / n * o, pb.y - dy / n * o, w * 0.7, C.white, al);
      } else bond(ctx, pa.x, pa.y, pb.x, pb.y, w, C.white, al);
    }
    // the water's second hydrogen bond forms as it leaves
    if (leave > 0.6) { const o = pos.Oh, h = pos.H2x; bond(ctx, o.x, o.y, h.x, h.y, 9 * o.k, C.white, seg(leave, 0.6, 1) * alphaOf("Oh")); }
    // the new peptide bond
    const nb = seg(t, snap, snap + 0.25);
    if (nb > 0) {
      const a = pos.C1, b = pos.N2;
      bond(ctx, a.x, a.y, b.x, b.y, 11 * a.k, C.cyan, nb);
      const fl = Math.max(0, 1 - (t - snap) / T(1.6));
      if (fl > 0) {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, g = ctx.createRadialGradient(mx, my, 0, mx, my, 260 * fl + 60);
        g.addColorStop(0, rgba(C.cyan, 0.7 * fl)); g.addColorStop(1, rgba(C.cyan, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 260 * fl + 60, 0, 7); ctx.fill();
      }
    }
    // extension residues
    if (ext > 0) {
      const ep = EXT.map((e) => ({ ...cam([e.x + 75, e.y, 0]), e }));
      for (const side of [-1, 1]) {
        let prev = side < 0 ? pos.N1 : pos.C2;
        for (const q of ep.filter((q) => q.e.side === side).sort((a, b) => a.e.s - b.e.s)) {
          const a = clamp(ext * 6 - q.e.s + 1);
          bond(ctx, prev.x, prev.y, q.x, q.y, 9 * q.k, C.white, a * 0.8);
          prev = q;
        }
      }
      for (const q of ep) sphere(ctx, q.x, q.y, RAD[q.e.el] * q.k, COL[q.e.el], clamp(ext * 6 - q.e.s + 1), 0.6);
    }
    const atoms = Object.values(pos).sort((a, b) => b.z - a.z);
    for (const p of atoms) {
      let glow = 0.55;
      if (p.id === "N1" || p.id === "H1a" || p.id === "H1b") glow += 1.2 * inOut(t, T(5.5), T(9), T(0.5));
      if (p.id === "C1" || p.id === "O1" || p.id === "Oh" || p.id === "Hh") glow += 1.2 * inOut(t, T(8), T(11.5), T(0.5));
      if (p.id === "Ca1") glow += 1.2 * inOut(t, T(10.5), T(13.5), T(0.5));
      if (p.id === "R1") glow += 1.2 * inOut(t, T(12.5), T(16), T(0.5));
      sphere(ctx, p.x, p.y, RAD[p.el] * p.k, COL[p.el], alphaOf(p.id), glow);
    }
    // mist as the water leaves
    if (rise > 0 && rise < 1) {
      const r = rng(4), o = pos.Oh;
      for (let i = 0; i < 40; i++) {
        const a = r() * 6.28, d = rise * (60 + r() * 160);
        ctx.fillStyle = rgba(C.cyan, 0.25 * (1 - rise) * r());
        ctx.beginPath(); ctx.arc(o.x + Math.cos(a) * d, o.y + Math.sin(a) * d * 0.6 - rise * 40, 3 + r() * 6, 0, 7); ctx.fill();
      }
    }

    // labels
    place($("amino"), pos.N1.x - 40, pos.N1.y + 150, inOut(t, T(5.5), T(16)));
    place($("carboxyl"), pos.Oh.x + 60, pos.Oh.y - 120, inOut(t, T(8), T(16)));
    place($("alpha"), pos.Ca1.x + 40, pos.Ca1.y + 80, inOut(t, T(10.5), T(16)));
    place($("rgroup"), pos.R1.x, pos.R1.y - 95, inOut(t, T(12.5), T(16)));
    place($("eq"), W / 2, 975, inOut(t, T(17), T(31)));
    place($("water"), pos.Oh.x + 150, pos.Oh.y, inOut(t, T(24), T(30)));
    const mb = { x: (pos.C1.x + pos.N2.x) / 2, y: (pos.C1.y + pos.N2.y) / 2 };
    place($("pbond"), mb.x, mb.y + 270, inOut(t, T(29), T(38)));
    place($("planar"), mb.x, mb.y - 300, inOut(t, T(33), T(39.5)));
    place($("pep"), W / 2, 230, inOut(t, T(41), D));
    frameFade(t, D);
  },
};
</script>
</body>
</html>
